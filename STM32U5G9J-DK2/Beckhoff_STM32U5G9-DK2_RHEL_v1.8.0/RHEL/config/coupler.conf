# EK9500 192.168.1.1 -> EL1409 -> EL2409 -> EL3074 -> EL4074
# One physical coupler exposes 16 DI, 16 DO, 4 AI and 4 AO as Modbus Unit ID 1.
[scanner]
profile_name = DI_DO_AI_AO
adapter_ip = 192.168.1.1
local_ip = 0.0.0.0
tcp_port = 44818
target_udp_port = 2222
local_udp_port = 2222
o2t_run_idle_header = true
t2o_run_idle_header = false
config_assembly = 128
input_assembly = 129
output_assembly = 130
input_assembly_size = 30
output_assembly_size = 22
input_header_bytes = 4
output_header_bytes = 4
o2t_rpi_us = 10000
t2o_rpi_us = 10000
service_cycle_ms = 2
input_stale_timeout_ms = 500
reconnect_delay_ms = 1000
strict_assembly_size = true

[terminal.DI1]
type = EL1409
position = 1
input_offset = 4
input_bytes = 2
logical_base = 1
pdo_layout = bit_packed

[terminal.DO1]
type = EL2409
position = 2
output_offset = 4
output_bytes = 2
logical_base = 1
pdo_layout = bit_packed

[terminal.AI1]
type = EL3074
position = 3
input_offset = 6
input_bytes = 16
logical_base = 1
pdo_layout = status_value_int16
channel_stride = 4
status_stride = 4
status_offset = 0
value_offset = 2
analog_mode = bipolar_10v
engineering_min = -10.0
engineering_max = 10.0
full_scale_raw = 30518
allow_extended_range = false

[terminal.AO1]
type = EL4074
position = 4
input_offset = 22
input_bytes = 8
status_stride = 2
status_offset = 0
output_offset = 6
output_bytes = 16
logical_base = 1
pdo_layout = real32
channel_stride = 4
value_offset = 0
analog_mode = bipolar_20ma
engineering_min = -0.020
engineering_max = 0.020
full_scale_raw = 30518
allow_extended_range = false
