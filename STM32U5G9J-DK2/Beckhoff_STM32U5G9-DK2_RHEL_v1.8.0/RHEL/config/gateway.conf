# Single EK9500 Modbus TCP Gateway v1.8.0 development configuration.
# STM32F407/LAN8720 design target: persistent TCP/502, 20 ms polling cycle.
# Give the STM32 a custom 500 req/s ceiling via masterctl add-stm32; keep
# this gateway-wide fallback conservative for ordinary ModScan/Beijer clients.
# Modbus TCP masters connect to the RHEL IP on this TCP port.
[modbus]
bind_ip = 0.0.0.0
port = 1502
# Optional second Modbus TCP listener. Beijer HMI commonly uses the standard port 502.
# Set to 0 to disable the secondary listener.
secondary_port = 502
max_clients = 16

# Only IPv4 addresses listed in this file may poll or write Modbus data.
# The file is reloaded on SIGHUP. Removed masters are disconnected immediately.
master_acl_file = masters.conf

# Used by scripts/masterctl.sh to request a live ACL reload.
pid_file = gateway.pid

# Bound the work performed for one connection in one epoll event so one master
# cannot monopolize the server while ModScan, an HMI, or another master polls.
max_requests_per_event_per_client = 16

idle_timeout_ms = 60000
max_requests_per_second_per_client = 200
input_stale_timeout_ms = 500
enable_tcp_keepalive = true
reject_writes_when_stale = true

# Unit ID 1 routes to the only EK9500 at 192.168.1.1.
[route.coupler]
enabled = true
unit_id = 1
coupler_config = coupler.conf
worker_period_ms = 5
