[modbus]
bind_ip = 0.0.0.0
port = 1502
secondary_port = 502
max_clients = 16
master_acl_file = /etc/ek9500-modbus-gateway/masters.conf
pid_file = /run/ek9500-modbus-gateway/gateway.pid
max_requests_per_event_per_client = 16
idle_timeout_ms = 60000
max_requests_per_second_per_client = 200
input_stale_timeout_ms = 500
enable_tcp_keepalive = true
reject_writes_when_stale = true

[route.coupler]
enabled = true
unit_id = 1
coupler_config = /etc/ek9500-modbus-gateway/coupler.conf
worker_period_ms = 5
